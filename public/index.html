<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microsaver</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><strong>◉ Microsaver</strong><span>LOCAL REVIEW · LEARNING LOOP</span></header><main><p class="eyebrow">YOUR DAILY INVESTMENT REVIEW</p><h1>Small savings.<br>Considered decisions.</h1><div id="message" class="notice"></div><section class="grid"><article><label>Broker credit</label><h2 id="credit">—</h2></article><article><label>Direct positions</label><h2 id="positions">—</h2><small id="portfolio-time"></small></article><article><label>Monthly savings plan</label><h2 id="savings">—</h2></article></section><div class="workspace-toolbar"><div class="actions"><button id="refresh">Refresh portfolio</button><button id="research">Create daily review</button><span id="activity"></span></div><nav class="review-tabs"><button id="today-tab">Today</button><button id="history-tab">History <span id="history-count">0</span></button></nav></div><section id="today-view" class="grid two"><article><h2>Daily alternatives</h2><div id="reviews"></div></article><div><article><h2>Settings</h2><form id="settings"><label>Monthly microsavings</label><input id="monthly" type="number" required><label>Research model</label><select id="model"><option value="gpt-5-mini">GPT-5 Mini</option><option value="gpt-5.6-luna">GPT-5.6 Luna</option><option value="gpt-5.6-terra">GPT-5.6 Terra</option><option value="gpt-5.6-sol">GPT-5.6 Sol</option></select><label>Order risk mode</label><select id="risk-mode"><option value="standard">Green · standard</option><option value="ultra">Yellow · ultra risk</option></select><p id="ultra-budget"></p><label class="check"><input type="checkbox" id="background"> Background research</label><button>Save settings</button></form></article><article><h2>Trading gates</h2><ul id="gates"></ul></article><article><h2>Connections</h2><p
